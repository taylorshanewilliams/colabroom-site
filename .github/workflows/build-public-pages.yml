name: Build public pages

# The song and musician pages, rebuilt from what people have published.
#
# Nightly rather than on a push, because the input is the database and not
# this repo: somebody putting a song on the showcase at nine in the evening
# should have a page by morning without anybody doing anything.
#
# Also on demand, which is what you want the first time and after every
# change to the two functions this reads.
on:
  workflow_dispatch:
  schedule:
    # 04:12 UTC. Not on the hour, because every scheduled job in the world is
    # on the hour and GitHub's queue shows it.
    - cron: '12 4 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Both of these are public by design and are not secrets.
      #
      # The anon key ships inside every copy of the app — it is in the web
      # bundle at app.colabroom.com and in both store binaries — and Supabase
      # names the current format `sb_publishable_` to make that unambiguous.
      # What protects the data is RLS and the two `security definer` functions
      # this calls, not the secrecy of this string. Putting it in a repo
      # secret would suggest otherwise and make it look like a leak the day
      # somebody found it in the bundle.
      #
      # The service role key is a different thing entirely and must never
      # appear in this workflow: it would let the generator publish anything
      # at all, and move the privacy gate out of the database and into a
      # script.
      - name: Build the pages
        env:
          SUPABASE_PROJECT_REF: gzcoclsfvazfhcheefhz
          SUPABASE_ANON_KEY: sb_publishable_4f7LPgcNnVyR0STyCSA7FQ_oTymmgvi
          SITE_DIR: ${{ github.workspace }}
        run: python tools/build_public_pages.py

      - name: Publish what changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pages for what people have published

          Generated by tools/build_public_pages.py from public_songs and
          public_musicians. Consent is showcased_at for a song and
          discoverable for a person; see migration 0096 in CoLabRoom-Flutter
          for what those gates are and what they deliberately exclude."
          git push
